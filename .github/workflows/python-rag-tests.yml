name: Python RAG tests

on:
  push:
    branches: [main]
    paths:
      - "code-examples/python/**"
      - ".github/workflows/python-rag-tests.yml"
  pull_request:
    paths:
      - "code-examples/python/**"
      - ".github/workflows/python-rag-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r code-examples/python/requirements-test.txt

      - name: Run ingestion tests
        working-directory: code-examples/python
        run: python -m pytest -q
